<div class="answer-area">

  <div class="answer-buttons">

    <button
      class="primary"
      id="yesBtn"
      onclick="yes()"
    >
      YES! 🤍
    </button>

    <div class="no-wrapper">

      <button
        class="secondary"
        id="noBtn"
        onclick="handleNo()"
      >
        No 😔
      </button>

      <span
        class="no-hint"
        id="noHint"
      >
        ← try clicking no 👀
      </span>

    </div>

  </div>

</div>
